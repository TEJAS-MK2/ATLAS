name: CodeQL Security Analysis

on:
  push:
    branches: [main, feature/atlas-4.0-spatial-foundation, feature/atlas-4.0-advanced-gis, work/atlas-4.0-ci-repair]
  pull_request:
    branches: [main, feature/atlas-4.0-spatial-foundation, feature/atlas-4.0-advanced-gis, feature/atlas-4.0-release-hardening]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
